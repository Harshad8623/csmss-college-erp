services:
  - type: web
    name: csmss-college-erp
    runtime: python
    region: singapore
    plan: starter
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn -c gunicorn.conf.py run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECRET_KEY
        sync: false          # Set manually in Render Dashboard
      - key: DATABASE_URL
        sync: false          # Set manually in Render Dashboard
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false          # Set manually in Render Dashboard
      - key: MAIL_PASSWORD
        sync: false          # Set manually in Render Dashboard (use Gmail App Password)
      - key: MAIL_DEFAULT_SENDER
        sync: false          # Set manually in Render Dashboard
      - key: VAPID_PUBLIC_KEY
        sync: false          # Set manually in Render Dashboard
      - key: VAPID_PRIVATE_KEY
        sync: false          # Set manually in Render Dashboard
      - key: VAPID_CLAIMS_EMAIL
        sync: false          # Set manually in Render Dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # Set manually in Render Dashboard
      - key: CLOUDINARY_API_KEY
        sync: false          # Set manually in Render Dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false          # Set manually in Render Dashboard
    autoDeploy: true
    healthCheckPath: /auth/login
