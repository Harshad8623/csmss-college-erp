{% extends "base.html" %}
{% block title %}500 – Server Error{% endblock %}
{% block content %}
<div style="text-align:center;padding:80px 20px;">
  <div style="font-size:80px;">⚙️</div>
  <h1 style="font-size:48px;font-weight:800;color:var(--text-primary);margin:16px 0 8px;">500</h1>
  <h2 style="font-size:20px;font-weight:600;color:var(--text-muted);margin-bottom:24px;">Internal Server Error</h2>
  <p style="color:var(--text-muted);max-width:400px;margin:0 auto 32px;">
    Something went wrong on our end. Please try again shortly or contact your administrator.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn-erp btn-primary-erp">
    ← Back to Dashboard
  </a>
</div>
{% endblock %}
