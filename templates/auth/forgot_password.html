<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Forgot Password — CSMSS College ERP">
  <title>Forgot Password | CSMSS ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary, #0f1117); }
    .auth-wrap { width: 100%; max-width: 420px; padding: 20px; }
    .auth-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo img { height: 52px; }
    .auth-logo h1 { font-size: 22px; font-weight: 700; color: #fff; margin: 10px 0 4px; }
    .auth-logo p { font-size: 13px; color: rgba(255,255,255,0.5); }
    .auth-icon-big {
      width: 70px; height: 70px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white; margin: 0 auto 20px;
      box-shadow: 0 8px 25px rgba(99,102,241,0.4);
    }
    .auth-title { text-align: center; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .auth-subtitle { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 28px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .input-icon { position: relative; }
    .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); font-size: 14px; }
    .input-icon input {
      width: 100%; padding: 12px 14px 12px 40px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #fff; font-size: 14px; font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box;
    }
    .input-icon input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .btn-primary-auth {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.3px;
    }
    .btn-primary-auth:hover { opacity: 0.9; transform: translateY(-1px); }
    .alert-box { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; }
    .alert-box.info  { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }
    .alert-box.danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.45); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: #6366f1; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/college_logo.png') }}" alt="CSMSS Logo">
      <h1>CSMSS ERP</h1>
      <p>Smart College Management System</p>
    </div>

    {% for category, message in get_flashed_messages(with_categories=True) %}
      <div class="alert-box {{ category }}"><i class="fa-solid fa-circle-info"></i> {{ message }}</div>
    {% endfor %}

    <div class="auth-icon-big"><i class="fa-solid fa-lock"></i></div>
    <h2 class="auth-title">Forgot Password?</h2>
    <p class="auth-subtitle">Enter your registered college email address.<br>We'll send you a 6-digit OTP to verify your identity.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" name="email" placeholder="yourname@csmss.ac.in" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn-primary-auth">
        <i class="fa-solid fa-paper-plane"></i> Send OTP
      </button>
    </form>

    <a href="{{ url_for('auth.login') }}" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
  </div>
</div>
</body>
</html>
