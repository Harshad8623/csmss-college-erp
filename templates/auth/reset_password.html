<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset Password — CSMSS College ERP">
  <title>Reset Password | CSMSS ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary, #0f1117); font-family: 'Inter', sans-serif; }
    .auth-wrap { width: 100%; max-width: 420px; padding: 20px; }
    .auth-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px); border-radius: 20px; padding: 40px 36px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo img { height: 52px; }
    .auth-logo h1 { font-size: 22px; font-weight: 700; color: #fff; margin: 10px 0 4px; }
    .auth-logo p { font-size: 13px; color: rgba(255,255,255,0.5); }
    .auth-icon-big {
      width: 70px; height: 70px; border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white; margin: 0 auto 20px;
      box-shadow: 0 8px 25px rgba(245,158,11,0.4);
    }
    .auth-title { text-align: center; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .auth-subtitle { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 28px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .input-icon { position: relative; }
    .input-icon i.icon-left { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); font-size: 14px; pointer-events: none; }
    .input-icon .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
    .input-icon input {
      width: 100%; padding: 12px 40px 12px 40px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #fff; font-size: 14px; font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box;
    }
    .input-icon input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
    .strength-bar { height: 4px; border-radius: 4px; margin-top: 8px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .strength-bar .fill { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; width: 0%; }
    .strength-label { font-size: 11px; margin-top: 5px; color: rgba(255,255,255,0.4); }
    .btn-primary-auth {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.3px;
    }
    .btn-primary-auth:hover { opacity: 0.9; transform: translateY(-1px); }
    .alert-box { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; }
    .alert-box.danger  { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
    .alert-box.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/college_logo.png') }}" alt="CSMSS Logo">
      <h1>CSMSS ERP</h1>
      <p>Smart College Management System</p>
    </div>

    {% for category, message in get_flashed_messages(with_categories=True) %}
      <div class="alert-box {{ category }}"><i class="fa-solid fa-circle-info"></i> {{ message }}</div>
    {% endfor %}

    <div class="auth-icon-big"><i class="fa-solid fa-key"></i></div>
    <h2 class="auth-title">Set New Password</h2>
    <p class="auth-subtitle">Choose a strong password. Minimum 8 characters, avoid common words.</p>

    <form method="POST" action="{{ url_for('auth.reset_password') }}" id="resetForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock icon-left"></i>
          <input type="password" id="new_password" name="new_password" placeholder="Min. 8 characters" required autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('new_password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="strength-bar"><div class="fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel">Password strength</div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock icon-left"></i>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary-auth">
        <i class="fa-solid fa-check"></i> Reset Password
      </button>
    </form>
  </div>
</div>

<script>
  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const ico = btn.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      ico.className = 'fa-regular fa-eye-slash';
    } else {
      inp.type = 'password';
      ico.className = 'fa-regular fa-eye';
    }
  }

  // ── Live password strength meter ──
  document.getElementById('new_password').addEventListener('input', function () {
    const val = this.value;
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;

    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    const colors = ['#ef4444', '#f97316', '#f59e0b', '#22c55e'];
    const labels = ['Too weak', 'Weak', 'Good', 'Strong'];

    fill.style.width = (score * 25) + '%';
    fill.style.background = colors[score - 1] || '#ef4444';
    label.textContent = score > 0 ? labels[score - 1] : 'Password strength';
    label.style.color = colors[score - 1] || 'rgba(255,255,255,0.4)';
  });

  // ── Confirm password validation ──
  document.getElementById('resetForm').addEventListener('submit', (e) => {
    const pw = document.getElementById('new_password').value;
    const cpw = document.getElementById('confirm_password').value;
    if (pw !== cpw) {
      e.preventDefault();
      alert('Passwords do not match. Please check and try again.');
    }
  });
</script>
</body>
</html>
