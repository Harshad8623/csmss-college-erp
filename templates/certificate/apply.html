{% extends "base.html" %}
{% block title %}Apply for Certificate{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title"><div class="title-icon">📜</div> Apply for Certificate</h1></div>
<div style="max-width:560px;">
  <div class="card-erp">
    <div class="card-body-erp">
      <form method="POST" action="{{ url_for('certificate.apply') }}" data-validate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group-erp">
          <label class="form-label-erp">Certificate Type *</label>
          <select name="type" class="form-control-erp" required>
            {% for val, label in cert_types %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group-erp">
          <label class="form-label-erp">Reason / Purpose</label>
          <textarea name="reason" class="form-control-erp" rows="4"
            placeholder="Briefly explain why you need this certificate..."></textarea>
        </div>
        <div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:var(--radius-sm);padding:12px;margin-bottom:18px;font-size:13px;color:var(--accent-green);">
          <i class="fa-solid fa-circle-info"></i>
          Your application will be reviewed by the admin. You'll be notified once approved.
        </div>
        <div style="display:flex;gap:12px;">
          <button type="submit" class="btn-erp btn-primary-erp">
            <i class="fa-solid fa-paper-plane"></i> Submit Application
          </button>
          <a href="{{ url_for('certificate.index') }}" class="btn-erp btn-outline-erp">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
