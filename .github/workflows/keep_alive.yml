name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes
  workflow_dispatch:         # Manual trigger button in GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CSMSS ERP
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}" https://csmss-erp.onrender.com
          echo " - Pinged at $(date)"
